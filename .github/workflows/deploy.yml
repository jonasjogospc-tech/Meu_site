name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "JPC_GAMING_site_GitHub/JPC_GAMING_site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JPC_GAMING_site_GitHub/JPC_GAMING_site/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: JPC_GAMING_site_GitHub/JPC_GAMING_site
      - name: Verificar código
        run: npm run lint
        working-directory: JPC_GAMING_site_GitHub/JPC_GAMING_site
      - name: Gerar build de produção
        run: npm run build
        working-directory: JPC_GAMING_site_GitHub/JPC_GAMING_site
      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: JPC_GAMING_site_GitHub/JPC_GAMING_site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
